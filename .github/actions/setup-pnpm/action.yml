name: Setup pnpm
description: Install pnpm, Node.js, and optionally project dependencies

inputs:
  node-version:
    description: Node.js version passed to actions/setup-node
    required: false
    default: 22.18.0
  install:
    description: Run pnpm install --frozen-lockfile after setup
    required: false
    default: 'true'
  setup-toolchain:
    description: Run pnpm/action-setup and actions/setup-node (skip when a cache action already did)
    required: false
    default: 'true'
  cache:
    description: Enable pnpm cache in actions/setup-node (disable when using setup-namespace-cache)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      if: inputs.setup-toolchain == 'true'

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: inputs.setup-toolchain == 'true'
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
