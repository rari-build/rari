name: Setup platform cache
description: OS-aware Namespace cache volumes for Linux, macOS, and Windows

inputs:
  linux-cache:
    description: Newline-separated cache modes for Linux (setup-namespace-cache)
    required: false
    default: ''
  macos-cache:
    description: Newline-separated cache modes for macOS (setup-namespace-cache)
    required: false
    default: ''
  windows-cache:
    description: Newline-separated cache modes for Windows (setup-namespace-cache). Requires cache volumes enabled on the windows/amd64 profile.
    required: false
    default: ''
  node-version:
    description: Node.js version for pnpm cache planning
    required: false
    default: 22.18.0

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-namespace-cache
      if: runner.os == 'Linux' && inputs.linux-cache != ''
      with:
        cache: ${{ inputs.linux-cache }}
        node-version: ${{ inputs.node-version }}

    - uses: ./.github/actions/setup-namespace-cache
      if: runner.os == 'macOS' && inputs.macos-cache != ''
      with:
        cache: ${{ inputs.macos-cache }}
        node-version: ${{ inputs.node-version }}

    - uses: ./.github/actions/setup-namespace-cache
      if: runner.os == 'Windows' && inputs.windows-cache != ''
      with:
        cache: ${{ inputs.windows-cache }}
        node-version: ${{ inputs.node-version }}
