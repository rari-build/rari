name: Setup Namespace cache
description: Configure Namespace cache volumes for dependencies and build outputs

inputs:
  cache:
    description: Newline-separated cache modes passed to nscloud-cache-action
    required: true
  node-version:
    description: Node.js version used when enabling pnpm cache planning
    required: false
    default: 24.21.0

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      if: contains(inputs.cache, 'pnpm')

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: contains(inputs.cache, 'pnpm')
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Configure Namespace cache
      uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
      with:
        cache: ${{ inputs.cache }}
