name: Setup Namespace cache
description: Configure Namespace cache volumes for dependencies and build outputs

inputs:
  cache:
    description: Newline-separated cache modes passed to nscloud-cache-action
    required: true
  node-version:
    description: Node.js version used when enabling pnpm cache planning
    required: false
    default: 22.18.0

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      if: contains(inputs.cache, 'pnpm')

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: contains(inputs.cache, 'pnpm')
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Configure Namespace cache
      uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
      with:
        cache: ${{ inputs.cache }}
