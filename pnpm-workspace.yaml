catalogMode: prefer
minimumReleaseAgeExclude:
  - '@rari/use-cache-darwin-arm64@0.16.0'
  - '@rari/use-cache-darwin-x64@0.16.0'
  - '@rari/use-cache-linux-arm64@0.16.0'
  - '@rari/use-cache-linux-x64@0.16.0'
  - '@rari/use-cache-win32-arm64@0.16.0'
  - '@rari/use-cache-win32-x64@0.16.0'
  - '@rari/use-cache@0.16.0'
  - rari-darwin-arm64@0.16.0
  - rari-darwin-x64@0.16.0
  - rari-linux-arm64@0.16.0
  - rari-linux-x64@0.16.0
  - rari-win32-arm64@0.16.0
  - rari-win32-x64@0.16.0
  - rari@0.16.0
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
packages:
  - examples/*
  - packages/*
  # Generated platform binary packages must not become workspace
  # importers or frozen CI installs fail after restore-use-cache-addon.
  - '!packages/rari-*'
  - '!packages/use-cache-*'
  - test/fixtures/*
  - tools/bundle-react-esm
  - web
catalogs:
  analytics:
    posthog-js: ^1.434.6
  build:
    '@napi-rs/cli': ^3.10.4
    oxc-transform-react: ^0.151.0
    rolldown: ^1.2.9
    vite: ^8.3.0
    vite-plus: ^0.3.3
  cli:
    '@clack/prompts': ^1.8.1
  font:
    '@capsizecss/metrics': ^4.3.0
    '@capsizecss/unpack': ^4.0.1
  lint:
    '@e18e/eslint-plugin': ^0.8.1
    '@eslint-community/eslint-plugin-eslint-comments': ^4.8.1
    '@eslint-react/eslint-plugin': ^5.20.5
    '@typescript-eslint/parser': ^8.70.1
    eslint: ^10.11.0
    eslint-config-flat-gitignore: ^2.4.0
    eslint-plugin-antfu: ^3.2.3
    eslint-plugin-command: ^4.0.0
    eslint-plugin-de-morgan: ^2.2.0
    eslint-plugin-jsonc: ^3.4.2
    eslint-plugin-oxlint: ^1.84.0
    eslint-plugin-perfectionist: ^5.11.1
    eslint-plugin-pnpm: ^1.9.1
    eslint-plugin-react-refresh: ^0.5.7
    eslint-plugin-regexp: ^3.3.1
    eslint-plugin-unused-imports: ^4.4.1
    eslint-plugin-yml: ^3.8.1
    jsonc-eslint-parser: ^3.3.0
    knip: ^6.37.0
    yaml-eslint-parser: ^2.1.0
  mdx:
    '@mdx-js/mdx': ^3.1.1
    '@shikijs/core': ^4.4.3
    '@shikijs/engine-oniguruma': ^4.4.3
    '@shikijs/langs': ^4.4.3
    '@shikijs/themes': ^4.4.3
    '@shikijs/types': ^4.4.3
    mermaid: ^12.0.0
    remark-gfm: ^4.0.1
  monitoring:
    '@sentry/react': ^10.75.1
  rari:
    '@rari/use-cache': ^0.15.17
    # rari: ^0.15.17
  react:
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    react: ^19.3.0
    react-dom: ^19.3.0
    react-server-dom-webpack: ^19.3.0
  stylex:
    '@stylexjs/stylex': ^0.19.1
    '@stylexjs/unplugin': ^0.19.1
  tailwind:
    '@tailwindcss/vite': ^4.3.3
    tailwindcss: ^4.3.3
  testing:
    '@playwright/test': ^1.63.0
    '@vitest/coverage-v8': ^5.0.1
  typescript:
    '@types/node': ^26.6.2
    # https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/#running-side-by-side-with-typescript-6.0
    typescript: npm:@typescript/typescript6@^6.0.2
    typescript-7: npm:typescript@^7.0.2
allowBuilds:
  core-js: true
