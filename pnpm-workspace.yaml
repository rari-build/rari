catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@rari/use-cache-darwin-arm64@0.17.10'
  - '@rari/use-cache-darwin-x64@0.17.10'
  - '@rari/use-cache-linux-arm64@0.17.10'
  - '@rari/use-cache-linux-x64@0.17.10'
  - '@rari/use-cache-win32-arm64@0.17.10'
  - '@rari/use-cache-win32-x64@0.17.10'
  - '@rari/use-cache@0.17.9'
  - rari-darwin-arm64@0.17.9
  - rari-darwin-x64@0.17.9
  - rari-linux-arm64@0.17.9
  - rari-linux-x64@0.17.9
  - rari-win32-arm64@0.17.9
  - rari-win32-x64@0.17.9
  - rari@0.17.9

shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - why-is-node-running@3.2.2

packages:
  - examples/*
  - packages/*
  # Generated platform binary packages must not become workspace
  # importers or frozen CI installs fail after restore-use-cache-addon.
  - '!packages/rari-*'
  - '!packages/use-cache-*'
  - test/fixtures/*
  - tools/bundle-react-esm
  - web

catalogs:
  analytics:
    posthog-js: ^1.450.0
  build:
    '@napi-rs/cli': ^3.10.12
    oxc-transform-react: ^0.158.0
    rolldown: ^1.3.2
    vite: ^8.3.8
    vite-plus: ^1.6.0
  cli:
    '@clack/prompts': ^1.9.0
  font:
    '@capsizecss/metrics': ^4.4.0
    '@capsizecss/unpack': ^4.0.1
  lint:
    '@e18e/eslint-plugin': ^0.8.1
    '@eslint-community/eslint-plugin-eslint-comments': ^4.8.1
    '@eslint-react/eslint-plugin': ^5.30.2
    '@typescript-eslint/parser': ^8.72.2
    eslint: ^10.15.0
    eslint-config-flat-gitignore: ^2.4.0
    eslint-plugin-antfu: ^3.3.1
    eslint-plugin-command: ^4.0.0
    eslint-plugin-de-morgan: ^2.3.0
    eslint-plugin-jsonc: ^3.4.2
    eslint-plugin-oxlint: ^1.93.0
    eslint-plugin-perfectionist: ^5.14.0
    eslint-plugin-pnpm: ^1.9.1
    eslint-plugin-react-refresh: ^0.5.8
    eslint-plugin-regexp: ^3.3.3
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    eslint-plugin-unused-imports: ^4.4.1
    eslint-plugin-yml: ^3.10.0
    jsonc-eslint-parser: ^3.3.0
    knip: ^6.45.1
    yaml-eslint-parser: ^2.1.0
  mdx:
    '@mdx-js/mdx': ^3.1.1
    '@shikijs/core': ^4.6.0
    '@shikijs/engine-oniguruma': ^4.6.0
    '@shikijs/langs': ^4.6.0
    '@shikijs/themes': ^4.6.0
    '@shikijs/types': ^4.6.0
    pele: ^1.13.0
    remark-gfm: ^4.0.1
  monitoring:
    '@sentry/react': ^11.12.0
  rari:
    '@rari/use-cache': ^0.17.9
    rari: ^0.17.9
  react:
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    react: ^19.3.1
    react-dom: ^19.3.1
    react-server-dom-webpack: ^19.3.1
  stylex:
    '@stylexjs/stylex': ^0.19.2
    '@stylexjs/unplugin': ^0.19.2
  tailwind:
    '@tailwindcss/vite': ^4.3.5
    tailwindcss: ^4.3.5
  testing:
    '@playwright/test': ^1.65.1
    '@vitest/coverage-v8': ^5.1.0
  typescript:
    '@types/node': ^26.6.6
    # https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/#running-side-by-side-with-typescript-6.0
    typescript: npm:@typescript/typescript6@^6.0.2
    typescript-7: npm:typescript@^7.0.2

allowBuilds:
  core-js: true
