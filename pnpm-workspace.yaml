    eslint-plugin-jsonc: ^3.4.1
    eslint-plugin-oxlint: ^1.78.0
    eslint-plugin-perfectionist: ^5.10.1
    eslint-plugin-pnpm: ^1.7.0
    eslint-plugin-react-refresh: ^0.5.4
    eslint-plugin-regexp: ^3.1.1
