catalogMode: prefer
minimumReleaseAgeExclude:
  - '@oxc-transform-react/binding-android-arm-eabi@0.147.0'
  - '@oxc-transform-react/binding-android-arm64@0.147.0'
  - '@oxc-transform-react/binding-darwin-arm64@0.147.0'
  - '@oxc-transform-react/binding-darwin-x64@0.147.0'
  - '@oxc-transform-react/binding-freebsd-x64@0.147.0'
  - '@oxc-transform-react/binding-linux-arm-gnueabihf@0.147.0'
  - '@oxc-transform-react/binding-linux-arm-musleabihf@0.147.0'
  - '@oxc-transform-react/binding-linux-arm64-gnu@0.147.0'
  - '@oxc-transform-react/binding-linux-arm64-musl@0.147.0'
  - '@oxc-transform-react/binding-linux-ppc64-gnu@0.147.0'
  - '@oxc-transform-react/binding-linux-riscv64-gnu@0.147.0'
  - '@oxc-transform-react/binding-linux-riscv64-musl@0.147.0'
  - '@oxc-transform-react/binding-linux-s390x-gnu@0.147.0'
  - '@oxc-transform-react/binding-linux-x64-gnu@0.147.0'
  - '@oxc-transform-react/binding-linux-x64-musl@0.147.0'
  - '@oxc-transform-react/binding-openharmony-arm64@0.147.0'
  - '@oxc-transform-react/binding-win32-arm64-msvc@0.147.0'
  - '@oxc-transform-react/binding-win32-ia32-msvc@0.147.0'
  - '@oxc-transform-react/binding-win32-x64-msvc@0.147.0'
  - oxc-transform-react@0.147.0
  - '@rari/use-cache-darwin-arm64@0.15.14 || 0.15.16'
  - '@rari/use-cache-darwin-x64@0.15.14 || 0.15.16'
  - '@rari/use-cache-linux-arm64@0.15.14 || 0.15.16'
  - '@rari/use-cache-linux-x64@0.15.14 || 0.15.16'
  - '@rari/use-cache-win32-arm64@0.15.14 || 0.15.16'
  - '@rari/use-cache-win32-x64@0.15.14 || 0.15.16'
  - '@rari/use-cache@0.15.14 || 0.15.16'
  - rari-darwin-arm64@0.15.14
  - rari-darwin-x64@0.15.14
  - rari-linux-arm64@0.15.14
  - rari-linux-x64@0.15.14
  - rari-win32-arm64@0.15.14
  - rari-win32-x64@0.15.14
  - rari@0.15.15
shellEmulator: true
trustPolicy: no-downgrade
packages:
  - examples/*
  - packages/*
  # Generated platform binary packages must not become workspace
  # importers or frozen CI installs fail after restore-use-cache-addon.
  - '!packages/rari-*'
  - '!packages/use-cache-*'
  - test/fixtures/*
  - tools/bundle-react-esm
  - web
catalogs:
  analytics:
    posthog-js: ^1.422.5
  build:
    '@napi-rs/cli': ^3.8.6
    lightningcss: ^1.33.0
    oxc-transform-react: ^0.147.0
    rolldown: ^1.2.6
    vite: ^8.2.2
    vite-plus: ^0.3.0
  cli:
    '@clack/prompts': ^1.7.0
  default:
    rari: ^0.15.15
  eslint:
    '@e18e/eslint-plugin': ^0.8.0
    '@eslint-community/eslint-plugin-eslint-comments': ^4.7.2
    '@eslint-react/eslint-plugin': ^5.18.6
    '@typescript-eslint/parser': ^8.68.0
    eslint: ^10.9.1
    eslint-config-flat-gitignore: ^2.4.0
    eslint-plugin-antfu: ^3.2.3
    eslint-plugin-command: ^4.0.0
    eslint-plugin-de-morgan: ^2.1.3
    eslint-plugin-jsonc: ^3.4.2
    eslint-plugin-oxlint: ^1.80.0
    eslint-plugin-perfectionist: ^5.10.1
    eslint-plugin-pnpm: ^1.8.0
    eslint-plugin-react-refresh: ^0.5.5
    eslint-plugin-regexp: ^3.2.0
    eslint-plugin-unused-imports: ^4.4.1
    eslint-plugin-yml: ^3.8.1
    jsonc-eslint-parser: ^3.3.0
    knip: ^6.33.0
    yaml-eslint-parser: ^2.1.0
  mdx:
    '@mdx-js/mdx': ^3.1.1
    '@shikijs/core': ^4.4.3
    '@shikijs/engine-oniguruma': ^4.4.3
    '@shikijs/langs': ^4.4.3
    '@shikijs/themes': ^4.4.3
    '@shikijs/types': ^4.4.3
    mermaid: ^11.17.2
    remark-gfm: ^4.0.1
  monitoring:
    '@sentry/react': ^10.72.0
  react:
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.5
    react: ^19.2.8
    react-dom: ^19.2.8
    react-server-dom-webpack: ^19.2.8
  tailwind:
    '@tailwindcss/vite': ^4.3.3
    tailwindcss: ^4.3.3
  testing:
    '@playwright/test': ^1.62.1
    '@vitest/coverage-v8': ^4.1.11
  typescript:
    '@types/node': ^26.4.0
    # https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/#running-side-by-side-with-typescript-6.0
    typescript: npm:@typescript/typescript6@^6.0.2
    typescript-7: npm:typescript@^7.0.2
allowBuilds:
  core-js: true
