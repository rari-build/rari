  - '@rari/use-cache-darwin-x64@0.15.11 || 0.15.12'
  - '@rari/use-cache-linux-arm64@0.15.11 || 0.15.12'
  - '@rari/use-cache-linux-x64@0.15.11 || 0.15.12'
  - '@rari/use-cache-win32-arm64@0.15.11 || 0.15.12'
